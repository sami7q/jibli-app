<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>تتبع الطلب - جبلي</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#FF5722',
              orange: '#FF5500',
              light: '#FFF2EB'
            }
          },
          fontFamily: {
            sans: ['Tajawal', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- Google Fonts for Arabic UI -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-styling">
    body {
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Map simulated elements */
    .map-pattern {
      background-color: #f4f3ef;
      background-image: 
        linear-gradient(rgba(226, 232, 240, 0.7) 1px, transparent 1px),
        linear-gradient(90deg, rgba(226, 232, 240, 0.7) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.9) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.9) 2px, transparent 2px);
      background-size: 24px 24px, 24px 24px, 72px 72px, 72px 72px;
      background-position: -1px -1px, -1px -1px, -1px -1px, -1px -1px;
    }

    /* Custom shadow for floating cards */
    .bubble-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    
    .bottom-sheet-shadow {
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-0 sm:p-4 antialiased">
<!-- BEGIN: MobileDeviceFrame -->
<div class="relative w-full max-w-[420px] h-screen sm:h-[880px] bg-[#f5f4f0] overflow-hidden flex flex-col justify-between sm:rounded-[48px] sm:border-[8px] sm:border-slate-800 shadow-2xl">
<!-- BEGIN: iOSStatusBar -->
<header class="relative z-30 pt-3 px-7 flex justify-between items-center text-black text-sm font-semibold select-none">
<!-- Time -->
<span class="tracking-tight text-[15px]">9:41</span>
<!-- Dynamic Island / Notch Placeholder -->
<div class="w-28 h-6 bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2.5 hidden sm:block"></div>
<!-- Status Icons -->
<div class="flex items-center gap-1.5">
<!-- Cellular Bars -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M2 17h3v4H2v-4zm6-5h3v9H8v-9zm6-5h3v14h-3V7zm6-4h3v18h-3V3z"></path>
</svg>
<!-- Wifi -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.78 0 7.26 1.44 9.9 3.84L12 18.9 2.1 11.34C4.74 8.94 8.22 7.5 12 7.5z"></path>
</svg>
<!-- Battery -->
<div class="w-5 h-2.5 border border-black rounded-[3px] p-0.5 flex items-center">
<div class="h-full w-full bg-black rounded-[1px]"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopNavigationBar -->
<nav class="relative z-20 px-5 pt-3 pb-2 flex items-center justify-between">
<!-- Back Button -->
<button aria-label="الرجوع" class="w-10 h-10 rounded-full bg-white/90 backdrop-blur shadow-sm border border-gray-100 flex items-center justify-center text-gray-800 active:scale-95 transition-transform" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Page Title -->
<h1 class="text-xl font-extrabold text-gray-900 tracking-tight ml-4">تتبع الطلب</h1>
<!-- Empty balance placeholder for center alignment -->
<div class="w-10"></div>
</nav>
<!-- END: TopNavigationBar -->
<!-- BEGIN: InteractiveMapArea -->
<main class="relative flex-1 w-full overflow-hidden map-pattern" data-purpose="map-view">
<!-- Vector Map Graphics & Road Lines -->
<svg class="absolute inset-0 w-full h-full pointer-events-none opacity-85" xmlns="http://www.w3.org/2000/svg">
<!-- City Green Parks -->
<rect fill="#e6efe4" height="150" rx="14" width="130" x="20" y="240"></rect>
<rect fill="#e6efe4" height="110" rx="10" width="110" x="260" y="270"></rect>
<rect fill="#e9f2e7" height="70" rx="8" width="90" x="220" y="80"></rect>
<!-- Baghdad Major Street Grids (Light Gray Road Network) -->
<g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
<line x1="-20" x2="440" y1="110" y2="160"></line>
<line x1="80" x2="40" y1="-20" y2="600"></line>
<line x1="170" x2="200" y1="-10" y2="600"></line>
<line x1="310" x2="270" y1="-10" y2="600"></line>
<line x1="-20" x2="440" y1="280" y2="240"></line>
<line x1="-20" x2="440" y1="390" y2="370"></line>
<line x1="-20" x2="440" y1="490" y2="520"></line>
</g>
<!-- Secondary Streets Lines -->
<g stroke="#ffffff" stroke-linecap="round" stroke-width="4">
<line x1="30" x2="160" y1="330" y2="330"></line>
<line x1="220" x2="380" y1="320" y2="320"></line>
<line x1="100" x2="260" y1="210" y2="190"></line>
<line x1="120" x2="320" y1="440" y2="430"></line>
</g>
<!-- Active Delivery Route (Orange Track) -->
<path d="M 125 330 L 210 320 L 205 270 L 285 255" fill="none" stroke="#FF5500" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"></path>
</svg>
<!-- Neighborhood Names in Arabic (Baghdad Landmarks) -->
<span class="absolute top-[88px] left-[175px] text-[12px] font-medium text-gray-500/80 -rotate-3 select-none">
        شارع الجامعة
      </span>
<span class="absolute top-[320px] right-[40px] text-[13px] font-bold text-gray-600/70 select-none">
        المنصور
      </span>
<span class="absolute top-[355px] left-[55px] text-[13px] font-bold text-gray-600/70 select-none">
        الكرادة
      </span>
<span class="absolute bottom-[30px] right-[130px] text-[12px] font-medium text-gray-500/80 select-none">
        شارع فلسطين
      </span>
<!-- ETA Notification Floating Balloon -->
<div class="absolute top-16 left-1/2 -translate-x-1/2 z-10 w-[78%] bg-white rounded-3xl py-3.5 px-5 bubble-shadow border border-white/60 text-center animate-pulse">
<h2 class="text-xl font-black text-gray-900 leading-tight">طلبك في الطريق</h2>
<p class="text-sm font-semibold text-gray-500 mt-0.5">الوصول خلال 10 دقائق</p>
<!-- Triangle indicator below tooltip -->
<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-4 h-4 bg-white rotate-45 border-b border-r border-gray-100/50"></div>
</div>
<!-- Restaurant Location Pin (Origin) -->
<div class="absolute top-[285px] right-[100px] z-10 flex flex-col items-center">
<!-- Orange Icon Pin -->
<div class="w-12 h-12 bg-[#FF5500] rounded-full shadow-lg flex items-center justify-center text-white border-[2.5px] border-white ring-4 ring-orange-500/20">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24">
<path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"></path>
</svg>
</div>
<!-- Pin Base Circle Anchor -->
<div class="w-3.5 h-3.5 bg-white border-[3px] border-[#FF5500] rounded-full mt-1.5 shadow-sm"></div>
</div>
<!-- Courier / Delivery Representative on Scooter (Destination / Current Location) -->
<div class="absolute top-[180px] left-[95px] z-20 flex flex-col items-center">
<!-- Animated 3D Courier Illustration (Jibli Theme) -->
<div class="relative w-28 h-28 transform transition hover:scale-105">
<svg class="w-full h-full drop-shadow-md" viewbox="0 0 120 120">
<!-- Jibli Orange Delivery Box -->
<rect fill="#FF5500" height="28" rx="6" stroke="#E04600" stroke-width="1.5" width="34" x="75" y="44"></rect>
<text fill="#ffffff" font-size="10" font-style="italic" font-weight="900" text-anchor="middle" x="92" y="62">Jibli</text>
<!-- Scooter Wheels -->
<circle cx="48" cy="90" fill="#2d3748" r="11" stroke="#ffffff" stroke-width="2"></circle>
<circle cx="48" cy="90" fill="#a0aec0" r="4"></circle>
<circle cx="88" cy="88" fill="#2d3748" r="10" stroke="#ffffff" stroke-width="2"></circle>
<circle cx="88" cy="88" fill="#a0aec0" r="3.5"></circle>
<!-- Scooter Body -->
<path d="M42 85 C55 85, 60 82, 65 72 L72 72 L88 80 L92 84 L52 87 Z" fill="#FF5500"></path>
<path d="M44 65 L52 86" stroke="#4A5568" stroke-linecap="round" stroke-width="4"></path>
<rect fill="#2D3748" height="7" rx="3" width="15" x="38" y="60"></rect>
<!-- Rider Body & Jibli Uniform -->
<path d="M58 52 C58 48, 66 48, 70 52 L78 68 C78 72, 70 76, 64 74 Z" fill="#FF5500"></path>
<!-- Rider Helmet (Orange & Visor) -->
<circle cx="63" cy="38" fill="#FF5500" r="11" stroke="#DD4800" stroke-width="1.5"></circle>
<path d="M54 39 C54 34, 62 33, 67 36 L65 42 L55 42 Z" fill="#1A202C"></path>
<!-- Hands & Handle -->
<circle cx="50" cy="62" fill="#E2E8F0" r="3.5"></circle>
</svg>
</div>
<!-- Pulse dot marker under bike -->
<div class="relative -mt-3 flex items-center justify-center">
<div class="w-3.5 h-3.5 bg-white border-[3px] border-[#FF5500] rounded-full z-10"></div>
<div class="w-7 h-7 bg-orange-400/40 rounded-full absolute animate-ping"></div>
</div>
</div>
</main>
<!-- END: InteractiveMapArea -->
<!-- BEGIN: BottomDeliveryCard -->
<section class="relative z-30 bg-white rounded-t-[36px] px-6 pt-5 pb-7 bottom-sheet-shadow flex flex-col gap-4">
<!-- Courier Profile Details Row -->
<div class="flex items-center justify-between">
<!-- Left / Start: Avatar & Info -->
<div class="flex items-center gap-3.5">
<!-- Driver Avatar Image Container -->
<div class="relative w-16 h-16 rounded-full overflow-hidden border-2 border-orange-500 shadow-inner bg-orange-50">
<!-- Delivery Driver Portrait Placeholder -->
<img alt="مندوب التوصيل أحمد" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHKBEPNOkqg74I34PHlIjHSwCQ3qRD6L0lR2ql-5DE2-Vl2if8o066c69hyfPxcggmu9WjlehhUw3X5zMrKnHuBCpyvEPXmWHsRixJsZMarNdyDAP8mUip7QCldj06H8GQ4CqSakDMAbYAT8C05kf3HwwxaYBqa_XtxeysPXC7kkU8-Yp9Fki4xutDW62ltASvLcLihottvcoCvlO2euR_tf76XGWsdvXpcUZ9krtFzezE0GqLjb7z"/>
<!-- Small Cap/Badge indicator -->
<div class="absolute bottom-0 inset-x-0 bg-[#FF5500]/90 text-[8px] text-white font-black text-center py-0.5">
              جبلي
            </div>
</div>
<!-- Driver Name & Status -->
<div class="text-right">
<h3 class="text-xl font-extrabold text-gray-900 leading-tight">أحمد</h3>
<p class="text-sm font-semibold text-gray-400 mt-0.5">مندوب التوصيل</p>
</div>
</div>
<!-- Right / End: Direct Phone Call Action Button -->
<a aria-label="اتصال بالمندوب" class="w-13 h-13 p-3 rounded-full border-2 border-[#FF5500] flex items-center justify-center text-[#FF5500] hover:bg-orange-50 active:scale-95 transition-all" href="tel:0770000000">
<svg class="w-6 h-6 fill-current transform scale-x-[-1]" viewbox="0 0 24 24">
<path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"></path>
</svg>
</a>
</div>
<!-- Main Action: Chat with Courier Button -->
<button class="w-full py-4 bg-[#FF5500] hover:bg-orange-600 active:bg-orange-700 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-orange-500/25 tracking-wide transition-all transform active:scale-[0.98]" type="button">
        مراسلة المندوب
      </button>
<!-- iOS Home Indicator -->
<div class="w-36 h-1 bg-gray-300 rounded-full mx-auto mt-1"></div>
</section>
<!-- END: BottomDeliveryCard -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
