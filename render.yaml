# =============================================================================
# API, worker and Key Value.
#
# These cannot run on Vercel, and the reason is structural rather than a
# configuration detail:
#
#   - the API is a long-running Fastify server holding a WebSocket gateway and
#     a persistent Redis subscriber; a serverless function cannot keep either
#     connection open between invocations
#   - the worker is a `while (running)` loop polling the transactional outbox
#     every second, plus scheduled settlement and reconciliation jobs
#
# Vercel hosts the two Next.js portals, which is what it is good at. This file
# provisions everything else.
#
# Deploy:  Render dashboard → Blueprints → New Blueprint Instance
# =============================================================================

# Secrets both services must share. The worker verifies nothing, but env
# validation is common to both, and a token the API signs must verify with the
# same secret wherever it is read — so they are generated once, here, rather
# than twice with two different values.
envVarGroups:
  - name: jibli-secrets
    envVars:
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Kept out of the database on purpose: it is what stops someone holding a
      # dump from brute-forcing stored OTP and delivery-PIN hashes.
      - key: OTP_HASH_PEPPER
        generateValue: true

      # Neon. The POOLED string (its host contains `-pooler`): the API opens a
      # connection per request burst, and the pooler is what keeps that inside
      # the project's connection limit.
      - key: DATABASE_URL
        sync: false
      # Migrations need the DIRECT string. The pooler runs in transaction mode,
      # which does not support the session-level statements DDL relies on.
      # Pointing both at the pooled string is the mistake to avoid: migrations
      # then fail with errors that read like a permissions problem.
      - key: DATABASE_MIGRATION_URL
        sync: false

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: jibli-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.service
    dockerContext: .
    dockerCommand: node build/api/index.mjs
    # `free` spins down after 15 minutes idle and takes about a minute to wake.
    # Fine for a pilot; move to a paid instance before real customers, or the
    # first order of the morning waits for a cold start.
    plan: free
    region: frankfurt
    healthCheckPath: /health/live
    envVars:
      - fromGroup: jibli-secrets

      - key: NODE_ENV
        value: production
      # Still `staging`, and still deliberately — but for a different reason
      # than before.
      #
      # The old reason is gone: OTP_PROVIDER is a real gateway now, so the
      # guard that refused `console` in production no longer applies.
      #
      # What holds it here is OTP_TEST_PHONES. The schema forbids fixed-code
      # test numbers in production, and App Review needs one to sign in at all
      # — a reviewer outside Iraq cannot receive an Iraqi SMS. So the order is
      # forced: ship with staging and the test number, pass review, then remove
      # OTP_TEST_PHONES and OTP_MOCK_CODE and move this to `production` as one
      # change.
      #
      # ⚠️ THIS IS THE LAST MANUAL STEP BEFORE PRODUCTION. Moving it also
      # requires real Redis, TLS on the database, and no localhost in CORS —
      # the schema checks all of them and refuses to boot otherwise.
      - key: APP_ENV
        value: staging

      # Apply pending migrations before serving the first request.
      #
      # This blueprint had no migration step at all. The image copies its
      # `.sql` files in — the Dockerfile even says they travel with it "so a
      # deploy applies the schema from the same artifact" — and nothing ever
      # ran them. The cost of that was a day of production where the API had
      # the code for `merchant_type` and the database did not have the column:
      # the customer app's home screen, the restaurant portal's shell and the
      # Admin directory all answered 500, `/health/ready` said "ok", and the
      # symptom pointed at the application rather than at the deploy.
      #
      # Render's pre-deploy command is the tidier place for this and is a paid
      # feature; doing it at boot needs no plan change and is safe here because
      # the runner takes an advisory lock. If this ever moves to a paid
      # instance, prefer:
      #
      #   preDeployCommand: node build/api/migrate.mjs
      #
      # and set this back to false.
      - key: RUN_MIGRATIONS_ON_BOOT
        value: 'true'

      - key: API_HOST
        value: 0.0.0.0
      # Render provides PORT; the app reads API_PORT, so they are aligned here.
      - key: API_PORT
        value: '4000'

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jibli-cache
          property: connectionString

      # Both portal origins, comma-separated. Filled after the Vercel URLs
      # exist. The browser normally talks only to its own origin — /api is
      # rewritten there — so this covers the WebSocket handshake.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Render terminates TLS in front of the container, so the client IP the
      # rate limiter keys on arrives in X-Forwarded-For.
      - key: TRUST_PROXY
        value: 'true'

      # `console` until a real account exists with one of the two providers
      # below. Both are built and tested; what is pending is the vendor
      # account, not the code.
      #
      # ── OTPIQ (verified working — this is the one to switch on) ──
      #
      # A real message to an Iraqi number came back `delivered` over WhatsApp
      # at 25 IQD, with no Meta business account and no WABA connected. The
      # cheap channel needs no verification and no contract; the alternatives
      # want weeks of business verification before the first message.
      #
      # Set these in the Render dashboard and change this value to
      # `sms_gateway`:
      #
      #   OTP_PROVIDER=sms_gateway
      #   SMS_GATEWAY_URL=https://api.otpiq.com/api/sms
      #   SMS_GATEWAY_API_KEY           (the project key, sk_live_…)
      #   SMS_GATEWAY_TO_FIELD=phoneNumber
      #   SMS_GATEWAY_SENDER_FIELD=senderId
      #   SMS_GATEWAY_NUMBER_FORMAT=e164_no_plus
      #   SMS_GATEWAY_BODY_FIELD=verificationCode
      #   SMS_GATEWAY_BODY_MODE=code
      #   SMS_GATEWAY_EXTRA_FIELDS={"smsType":"verification","provider":"auto"}
      #
      # `provider=auto` tries WhatsApp, then Telegram, then SMS — roughly a
      # tenth of the SMS price for the common case, and it degrades on its own
      # for a customer who is not on WhatsApp. It requires `BODY_MODE=code`:
      # WhatsApp carries an approved template with the code in a slot, never
      # free text, so we send the digits and OTPIQ owns the wording.
      #
      # To keep our own Arabic wording instead — at the full SMS price, SMS
      # only — use BODY_FIELD=customMessage, BODY_MODE=text and
      # EXTRA_FIELDS={"smsType":"custom","provider":"sms"}. There `smsType` is
      # the load-bearing one: without `custom`, OTPIQ generates a code of its
      # own, the customer receives one this API never stored, and no sign-in
      # can succeed while every request still returns 200 OK.
      #
      # Prove it locally first, one channel at a time:
      #   pnpm sms:test +9647XXXXXXXXX --via whatsapp
      #   pnpm sms:test +9647XXXXXXXXX --via auto
      #
      # ── WhatsApp, via Meta ──
      #
      #   OTP_PROVIDER=whatsapp
      #   WHATSAPP_PHONE_NUMBER_ID   (WhatsApp Manager — the sender id)
      #   WHATSAPP_ACCESS_TOKEN      (a PERMANENT System User token)
      #   WHATSAPP_TEMPLATE_NAME     (an approved AUTHENTICATION template)
      #
      # The env schema refuses to boot with either provider and its required
      # values missing, so a half-finished switch fails loudly at deploy
      # rather than quietly at somebody's first sign-in.
      # ⚠️ ONE WORD AWAY FROM REAL SMS — AND FROM AN API THAT WILL NOT BOOT.
      #
      # Change this to `sms_gateway` **only after** SMS_GATEWAY_API_KEY exists
      # on the `jibli-secrets` group in the Render dashboard. The env schema
      # refuses to start with `sms_gateway` and no key
      # (packages/config/src/env.ts, "sms_gateway provider requires
      # SMS_GATEWAY_URL and SMS_GATEWAY_API_KEY") — so flipping it first takes
      # the whole API down rather than degrading to no SMS. That is the correct
      # guard and a bad surprise, in that order.
      #
      # While it reads `console`: a real code is generated and handed to a
      # provider that records only *that* a message was sent, never the code.
      # So exactly one number can sign in — the one in OTP_TEST_PHONES, with
      # OTP_MOCK_CODE. Every other number receives nothing while every request
      # still answers 200 OK.
      - key: OTP_PROVIDER
        value: console

      # The wire format OTPIQ expects, staged and waiting. Harmless while
      # OTP_PROVIDER is `console` — nothing reads them — so the only remaining
      # step is the secret and the one word above.
      #
      # Field names are configuration because no two Iraqi aggregators agree on
      # them; these are the values proven against the live gateway and
      # documented in docs/operations/store-submission.md.
      - key: SMS_GATEWAY_URL
        value: https://api.otpiq.com/api/sms
      - key: SMS_GATEWAY_AUTH_SCHEME
        value: bearer
      - key: SMS_GATEWAY_TO_FIELD
        value: phoneNumber
      - key: SMS_GATEWAY_SENDER_FIELD
        value: senderId
      # The single most common reason a correctly-configured gateway delivers
      # nothing: OTPIQ rejects the leading plus.
      - key: SMS_GATEWAY_NUMBER_FORMAT
        value: e164_no_plus
      - key: SMS_GATEWAY_BODY_FIELD
        value: verificationCode
      # `code`, not `text`: with provider=auto the message travels as an
      # approved WhatsApp template with the digits in a slot, never free text.
      - key: SMS_GATEWAY_BODY_MODE
        value: code
      # provider=auto tries WhatsApp, then Telegram, then SMS — about a tenth of
      # the SMS price for the common case, degrading on its own for a customer
      # who has neither.
      - key: SMS_GATEWAY_EXTRA_FIELDS
        value: '{"smsType":"verification","provider":"auto"}'

      # SMS_GATEWAY_API_KEY is a secret and is deliberately absent from this
      # file. Set it in the Render dashboard on the `jibli-secrets` env group,
      # unsynced. The env schema refuses to boot `sms_gateway` without it, so a
      # half-finished switch fails at deploy rather than at somebody's sign-in.

      # Nobody but the store reviewers.
      #
      # App Review sits outside Iraq and cannot receive an Iraqi SMS, so this
      # number keeps a fixed code and returns it in the response. Every other
      # number now goes through the real gateway above.
      #
      # REMOVE THIS BEFORE `APP_ENV=production`. The env schema refuses the
      # setting outright in production, so leaving it in is not a silent risk —
      # it is a boot failure. That is deliberate.
      - key: OTP_TEST_PHONES
        value: '+9647712345678'
      - key: OTP_MOCK_CODE
        value: '1234'

      # The API never calls ctx.push — only the worker sends notifications —
      # but the value is read by the same env schema, so it is kept aligned
      # with the worker's rather than left to drift.
      - key: PUSH_PROVIDER
        value: expo

  # ── Worker ─────────────────────────────────────────────────────────────────
  #
  # Render has no free tier for background workers, so this is the one line in
  # the file that costs money. What it does:
  #
  #   - publishes the transactional outbox, which is what pushes live order
  #     events to the board and to phones
  #   - generates settlements and runs reconciliation on a schedule
  #
  # Without it the portals still work: the order board polls as a fallback, and
  # settlements can be generated by hand from Admin. Comment this service out to
  # start free, and add it before the first real settlement period closes.
  - type: worker
    name: jibli-worker
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.service
    dockerContext: .
    dockerCommand: node build/worker/index.mjs
    plan: 0.5c-512mb
    region: frankfurt
    envVars:
      - fromGroup: jibli-secrets
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jibli-cache
          property: connectionString

      # The worker is the only process that sends notifications, so this is the
      # value that decides whether any of them leave the building.
      #
      # It read `console`, and the worker ignored it anyway — the provider was
      # hardcoded. Both halves are fixed: the worker now selects from this, and
      # `createPushProvider` throws at boot rather than accept `console` under
      # NODE_ENV=production. A stub that reports success is worse than a crash.
      #
      # EXPO_ACCESS_TOKEN is optional and is a secret: set it on the
      # `jibli-secrets` group if the Expo project has enhanced security on,
      # where its absence is an unexplained 401 rather than a warning.
      - key: PUSH_PROVIDER
        value: expo

  # ── Key Value ──────────────────────────────────────────────────────────────
  #
  # Rate-limit state and the realtime pub/sub channel. It is a cache and a
  # transport: every invariant lives in PostgreSQL, so losing it costs live
  # updates and rate-limit counters, never data. That is what makes the free
  # plan — which keeps data in memory only and drops it on restart —
  # survivable here.
  #
  # `noeviction` matters. Under memory pressure Redis would otherwise drop
  # keys, and silently evicting a rate-limit counter turns a limiter into a
  # no-op exactly when it is under load.
  - type: keyvalue
    name: jibli-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
