# =============================================================================
# API, worker and Key Value.
#
# These cannot run on Vercel, and the reason is structural rather than a
# configuration detail:
#
#   - the API is a long-running Fastify server holding a WebSocket gateway and
#     a persistent Redis subscriber; a serverless function cannot keep either
#     connection open between invocations
#   - the worker is a `while (running)` loop polling the transactional outbox
#     every second, plus scheduled settlement and reconciliation jobs
#
# Vercel hosts the two Next.js portals, which is what it is good at. This file
# provisions everything else.
#
# Deploy:  Render dashboard → Blueprints → New Blueprint Instance
# =============================================================================

# Secrets both services must share. The worker verifies nothing, but env
# validation is common to both, and a token the API signs must verify with the
# same secret wherever it is read — so they are generated once, here, rather
# than twice with two different values.
envVarGroups:
  - name: jibli-secrets
    envVars:
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Kept out of the database on purpose: it is what stops someone holding a
      # dump from brute-forcing stored OTP and delivery-PIN hashes.
      - key: OTP_HASH_PEPPER
        generateValue: true

      # Neon. The POOLED string (its host contains `-pooler`): the API opens a
      # connection per request burst, and the pooler is what keeps that inside
      # the project's connection limit.
      - key: DATABASE_URL
        sync: false
      # Migrations need the DIRECT string. The pooler runs in transaction mode,
      # which does not support the session-level statements DDL relies on.
      # Pointing both at the pooled string is the mistake to avoid: migrations
      # then fail with errors that read like a permissions problem.
      - key: DATABASE_MIGRATION_URL
        sync: false

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: jibli-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.service
    dockerContext: .
    dockerCommand: node build/api/index.mjs
    # `free` spins down after 15 minutes idle and takes about a minute to wake.
    # Fine for a pilot; move to a paid instance before real customers, or the
    # first order of the morning waits for a cold start.
    plan: free
    region: frankfurt
    healthCheckPath: /health/live
    envVars:
      - fromGroup: jibli-secrets

      - key: NODE_ENV
        value: production
      # `staging`, not `production`, and deliberately: production refuses to
      # boot with OTP_PROVIDER=console, which is the correct guard — nobody can
      # sign into the mobile app without a real SMS gateway. The portals use
      # passwords and are unaffected.
      - key: APP_ENV
        value: staging

      - key: API_HOST
        value: 0.0.0.0
      # Render provides PORT; the app reads API_PORT, so they are aligned here.
      - key: API_PORT
        value: '4000'

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jibli-cache
          property: connectionString

      # Both portal origins, comma-separated. Filled after the Vercel URLs
      # exist. The browser normally talks only to its own origin — /api is
      # rewritten there — so this covers the WebSocket handshake.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Render terminates TLS in front of the container, so the client IP the
      # rate limiter keys on arrives in X-Forwarded-For.
      - key: TRUST_PROXY
        value: 'true'

      # `console` until a real account exists with one of the two providers
      # below. Both are built and tested; what is pending is the vendor
      # account, not the code.
      #
      # ── SMS, via OTPIQ (the shorter road) ──
      #
      # Self-service signup, prices in IQD, prepaid, no contract — against
      # weeks of business verification for the alternatives. Set these in the
      # Render dashboard and change this value to `sms_gateway`:
      #
      #   OTP_PROVIDER=sms_gateway
      #   SMS_GATEWAY_URL=https://api.otpiq.com/api/sms
      #   SMS_GATEWAY_API_KEY           (the project key, sk_live_…)
      #   SMS_GATEWAY_TO_FIELD=phoneNumber
      #   SMS_GATEWAY_SENDER_FIELD=senderId
      #   SMS_GATEWAY_NUMBER_FORMAT=e164_no_plus
      #   SMS_GATEWAY_BODY_FIELD=verificationCode
      #   SMS_GATEWAY_BODY_MODE=code
      #   SMS_GATEWAY_EXTRA_FIELDS={"smsType":"verification","provider":"auto"}
      #
      # `provider=auto` tries WhatsApp, then Telegram, then SMS — roughly a
      # tenth of the SMS price for the common case, and it degrades on its own
      # for a customer who is not on WhatsApp. It requires `BODY_MODE=code`:
      # WhatsApp carries an approved template with the code in a slot, never
      # free text, so we send the digits and OTPIQ owns the wording.
      #
      # To keep our own Arabic wording instead — at the full SMS price, SMS
      # only — use BODY_FIELD=customMessage, BODY_MODE=text and
      # EXTRA_FIELDS={"smsType":"custom","provider":"sms"}. There `smsType` is
      # the load-bearing one: without `custom`, OTPIQ generates a code of its
      # own, the customer receives one this API never stored, and no sign-in
      # can succeed while every request still returns 200 OK.
      #
      # Prove it locally first, one channel at a time:
      #   pnpm sms:test +9647XXXXXXXXX --via whatsapp
      #   pnpm sms:test +9647XXXXXXXXX --via auto
      #
      # ── WhatsApp, via Meta ──
      #
      #   OTP_PROVIDER=whatsapp
      #   WHATSAPP_PHONE_NUMBER_ID   (WhatsApp Manager — the sender id)
      #   WHATSAPP_ACCESS_TOKEN      (a PERMANENT System User token)
      #   WHATSAPP_TEMPLATE_NAME     (an approved AUTHENTICATION template)
      #
      # The env schema refuses to boot with either provider and its required
      # values missing, so a half-finished switch fails loudly at deploy
      # rather than quietly at somebody's first sign-in.
      - key: OTP_PROVIDER
        value: console
      # The demo account, and nothing else, can sign in here.
      #
      # `console` generates a real code and hands it to a provider that only
      # logs that an SMS went out — never the code, by design. So the deployed
      # app could open every screen and finish nothing: no number could receive
      # a code, including the one the pilot was meant to be shown from.
      #
      # `OTP_PROVIDER=mock` would fix it by making 0000 work for *any* number,
      # on a URL anybody can reach. This is the same mechanism for one number:
      # it gets OTP_MOCK_CODE and the code back in the response, every other
      # number keeps a random code it cannot read, and the env schema refuses
      # the setting outright when APP_ENV is production.
      #
      # Remove it the day a real SMS gateway is connected.
      - key: OTP_TEST_PHONES
        value: '+9647712345678'
      - key: OTP_MOCK_CODE
        value: '1234'
      - key: PUSH_PROVIDER
        value: console

  # ── Worker ─────────────────────────────────────────────────────────────────
  #
  # Render has no free tier for background workers, so this is the one line in
  # the file that costs money. What it does:
  #
  #   - publishes the transactional outbox, which is what pushes live order
  #     events to the board and to phones
  #   - generates settlements and runs reconciliation on a schedule
  #
  # Without it the portals still work: the order board polls as a fallback, and
  # settlements can be generated by hand from Admin. Comment this service out to
  # start free, and add it before the first real settlement period closes.
  - type: worker
    name: jibli-worker
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.service
    dockerContext: .
    dockerCommand: node build/worker/index.mjs
    plan: 0.5c-512mb
    region: frankfurt
    envVars:
      - fromGroup: jibli-secrets
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jibli-cache
          property: connectionString
      - key: PUSH_PROVIDER
        value: console

  # ── Key Value ──────────────────────────────────────────────────────────────
  #
  # Rate-limit state and the realtime pub/sub channel. It is a cache and a
  # transport: every invariant lives in PostgreSQL, so losing it costs live
  # updates and rate-limit counters, never data. That is what makes the free
  # plan — which keeps data in memory only and drops it on restart —
  # survivable here.
  #
  # `noeviction` matters. Under memory pressure Redis would otherwise drop
  # keys, and silently evicting a rate-limit counter turns a limiter into a
  # no-op exactly when it is under load.
  - type: keyvalue
    name: jibli-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
