# =============================================================================
# API and worker.
#
# These cannot run on Vercel, and the reason is structural rather than a
# configuration detail:
#
#   - the API is a long-running Fastify server holding a WebSocket gateway and
#     a persistent Redis subscriber; a serverless function cannot keep either
#     connection open between invocations
#   - the worker is a `while (running)` loop polling the transactional outbox
#     every second, plus scheduled settlement and reconciliation jobs
#
# Vercel hosts the two Next.js portals, which is what it is good at. This file
# provisions everything else. Render is used here because one blueprint covers
# both services and Redis; Railway and Fly.io work identically from the same
# Dockerfile.
#
# Deploy:  Render dashboard → New → Blueprint → point at this repository
# =============================================================================

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: jibli-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.service
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /health/live
    dockerBuildArgs:
      SERVICE: api
    envVars:
      - key: NODE_ENV
        value: production
      # `staging` until a real SMS provider exists. `production` refuses to
      # boot with OTP_PROVIDER=console, which is the correct guard: nobody can
      # sign into the mobile app without one. The portals use passwords and are
      # unaffected.
      - key: APP_ENV
        value: staging
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: '4000'

      # Neon. Use the POOLED connection string here (the host containing
      # `-pooler`): the API opens a connection per request burst and Neon's
      # pooler is what keeps that within the project's connection limit.
      - key: DATABASE_URL
        sync: false
      # Migrations need the DIRECT string. The pooler runs in transaction mode,
      # which does not support the session-level statements DDL relies on.
      - key: DATABASE_MIGRATION_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: redis
          name: jibli-redis
          property: connectionString

      # Generate each separately: openssl rand -base64 48
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_HASH_PEPPER
        generateValue: true

      # Both portal origins. The browser only talks to its own Vercel origin
      # because /api/* is rewritten there, so this covers the WebSocket
      # handshake and any direct call.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Required so the refresh cookie is accepted by the portals. See
      # docs/operations/deployment.md — without a shared parent domain the
      # cookie is third-party and every session dies at page load.
      - key: SESSION_COOKIE_DOMAIN
        sync: false

      # Render terminates TLS in front of the container, so the client IP the
      # rate limiter keys on comes from X-Forwarded-For.
      - key: TRUST_PROXY
        value: 'true'

      - key: OTP_PROVIDER
        value: console
      - key: PUSH_PROVIDER
        value: console

  # ── Worker ─────────────────────────────────────────────────────────────────
  - type: worker
    name: jibli-worker
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.service
    dockerContext: .
    plan: starter
    region: frankfurt
    dockerBuildArgs:
      SERVICE: worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      # Same pooled string as the API.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: jibli-redis
          property: connectionString
      # The worker signs nothing, but env validation is shared and demands
      # these. They must match the API's or a token it issues will not verify.
      - key: JWT_ACCESS_SECRET
        fromService:
          type: web
          name: jibli-api
          envVarKey: JWT_ACCESS_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: web
          name: jibli-api
          envVarKey: JWT_REFRESH_SECRET
      - key: OTP_HASH_PEPPER
        fromService:
          type: web
          name: jibli-api
          envVarKey: OTP_HASH_PEPPER
      - key: PUSH_PROVIDER
        value: console

# ── Redis ────────────────────────────────────────────────────────────────────
# Rate-limit state and the realtime pub/sub channel. It is a cache and a
# transport: every invariant lives in PostgreSQL, so losing Redis costs live
# updates, never data.
#
# `noeviction` matters. Under memory pressure Redis would otherwise drop keys,
# and silently evicting a rate-limit counter turns a limiter into a no-op.
databases:
  - name: jibli-redis
    type: redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
